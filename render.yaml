# Render Blueprint Specification for MedCare Hospital Management System (HMS)
# Designed for Render Free Tier deployment (Single Full-Stack Web Service + Free PostgreSQL)

services:
  - type: web
    name: medcare-hms-demo
    runtime: node
    plan: free
    region: oregon # or ohio, frankfurt, singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:init && npm run demo:init && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true # Generates secure 32+ character random secret automatically
      - key: DATABASE_URL
        fromDatabase:
          name: medcare-hms-db
          property: connectionString

databases:
  - name: medcare-hms-db
    plan: free # Free tier PostgreSQL database
    databaseName: medcare_demo
    user: medcare_user
    region: oregon
